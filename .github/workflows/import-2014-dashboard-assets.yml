name: Import 2014 dashboard assets

on:
  push:
    branches:
      - chatgpt/2014-menu-no-login
    paths:
      - .github/workflows/import-2014-dashboard-assets.yml

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out menu branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/2014-menu-no-login
          fetch-depth: 0

      - name: Extract dashboard assets from main branch archive
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:BimBam_2014_dashboard_import.zip > /tmp/BimBam_2014_dashboard_import.zip
          unzip -o /tmp/BimBam_2014_dashboard_import.zip -d .
          test -d quest-roblox-vr/app/src/main/res/drawable-nodpi

      - name: Commit extracted assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quest-roblox-vr/app/src/main/res/drawable-nodpi
          if git diff --cached --quiet; then
            echo "No new dashboard assets to commit."
            exit 0
          fi
          git commit -m "Import original 2014 dashboard assets"
          git push origin HEAD:chatgpt/2014-menu-no-login
