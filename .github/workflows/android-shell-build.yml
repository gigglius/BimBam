name: Android shell build

on:
  workflow_dispatch:
  push:
    branches:
      - work/quest-native-engine-port

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build Android debug APK
        working-directory: quest-roblox-vr
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: roblox2014vr-shell-debug
          path: quest-roblox-vr/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
