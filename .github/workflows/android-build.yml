name: Android APK build

on:
  push:
    branches:
      - main
      - 'port/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: quest-roblox-vr
        run: gradle assembleDebug

      - name: Verify APK does not contain legacy 32-bit native libraries
        run: |
          APK="quest-roblox-vr/app/build/outputs/apk/debug/app-debug.apk"
          if unzip -l "$APK" | grep -E 'lib/(armeabi|armeabi-v7a)/'; then
            echo "Unexpected 32-bit native library found in Quest APK"
            exit 1
          fi
          echo "No legacy 32-bit native libraries packaged."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roblox-2014-vr-debug-apk
          path: quest-roblox-vr/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
