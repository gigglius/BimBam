plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gigglius.robloxvr'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gigglius.robloxvr'
        // Quest 3/Horizon OS baseline for this private sideload target.
        minSdk 32
        targetSdk 34
        versionCode 2
        versionName '0.2'

        // Never package the recovered 32-bit-only engine by accident.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }
}
