<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta charset="utf-8"><title>BimBam 2014</title>
<style>
:root{--blue:#2877bd;--nav:#222;--line:#d5d5d5;--text:#333;--muted:#777}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;background:#fff}
.top{height:54px;flex:none;background:#202020;color:#fff;display:flex;align-items:center;padding:0 18px;gap:18px;border-bottom:3px solid #111}
.brand{font-weight:bold;font-size:21px;letter-spacing:-1px;color:#fff}.brand em{color:#83c9ff;font-style:normal}
.topnav{display:flex;gap:22px;align-items:center;flex:1}.topnav button,.top button{background:none;border:0;color:#eee;font-size:15px;padding:10px 8px}
.account{display:flex;gap:15px;align-items:center;font-size:13px;color:#ddd}.balance{white-space:nowrap}
.main{min-height:0;flex:1;display:flex;overflow:hidden}
.rail{width:54px;background:#202020;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:14px;color:#ddd}
.rail .dot{width:27px;height:27px;border-radius:50%;border:1px solid #777;display:grid;place-items:center;font-size:13px}
.content{flex:1;min-width:0;overflow:auto;background:#fff;padding:20px 24px}
.page-title{font-size:23px;font-weight:bold;border-bottom:1px solid #ddd;padding:0 0 12px;margin-bottom:16px}
.homegrid{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:16px}
.tile{border:1px solid #d4d4d4;background:#fff;box-shadow:0 1px 2px #bbb;min-height:185px;display:flex;flex-direction:column;cursor:pointer}
.tile .art{height:132px;background:#f4f4f4 center/contain no-repeat;display:grid;place-items:center}
.tile .art img{max-width:100%;max-height:100%;object-fit:contain}
.tile .label{height:43px;background:#2877bd;color:#fff;font-size:16px;font-weight:bold;display:grid;place-items:center}
.tile .sub{height:28px;text-align:center;color:#777;font-size:12px;padding-top:7px}
.section-title{font-size:21px;color:#333;margin:20px 0 12px;border-bottom:1px solid #ddd;padding-bottom:8px}
.sidebar{width:210px;flex:none;background:#f2f2f2;border-right:1px solid #ccc;padding:14px 12px;overflow:auto}
.sideitem{padding:10px 9px;border-bottom:1px solid #e1e1e1;font-size:14px;cursor:pointer}.sideitem.active{background:#ddd;font-weight:bold}
.search{width:100%;padding:9px;border:1px solid #bbb;margin:8px 0 12px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{border:1px solid #ddd;padding:10px;min-height:120px;background:#fff}
.card h3{font-size:16px;margin:6px 0}.card p{font-size:13px;color:#666;margin:5px 0}
.btn{background:#2877bd;color:#fff;border:0;padding:9px 16px;font-weight:bold;cursor:pointer}
.detail{display:grid;grid-template-columns:minmax(200px,42%) 1fr;gap:20px}.preview{background:#eee;min-height:210px;display:grid;place-items:center;border:1px solid #ddd}
.preview img{max-width:95%;max-height:210px;object-fit:contain}
.tabs{display:flex;gap:4px;border-bottom:1px solid #ccc;margin:12px 0}.tabs button{padding:9px 14px;border:1px solid #ccc;background:#eee}
.game-screen{position:absolute;inset:0;background:#111b;color:#fff;display:none;align-items:center;justify-content:center}
.menu-panel{width:min(440px,80vw);background:#171717eF;border:1px solid #777;padding:22px;text-align:center}
.menu-panel h2{font-size:23px;margin:4px 0 18px}.menu-panel button{display:block;width:100%;margin:8px 0;padding:12px;background:#222;color:#fff;border:1px solid #aaa;font-size:16px}
@media(max-width:800px){.sidebar{width:150px}.homegrid{grid-template-columns:repeat(2,minmax(120px,1fr))}.account{gap:6px}.topnav{gap:4px}.topnav button{font-size:12px}}
</style></head>
<body><div id="app">
<header class="top"><div class="brand">ROBLOX</div><nav class="topnav"><button onclick="show('Home')">Home</button><button onclick="show('Games')">Games</button><button onclick="show('Catalog')">Catalog</button><button onclick="show('Develop')">Develop</button><button onclick="show('Groups')">Groups</button></nav><div class="account"><span>1234</span><span class="balance">R$ 0</span><span class="balance">Tix 0</span></div></header>
<div class="main"><div class="rail"><div class="dot">R</div><div class="dot">⌂</div><div class="dot">▶</div><div class="dot">▣</div><div class="dot">●</div></div>
<aside class="sidebar"><img src="file:///android_res/drawable-nodpi/roblox_logo.png" style="width:100%;height:42px;object-fit:contain" onerror="this.style.display='none'"><div style="font-weight:bold;text-align:center;padding:8px">1234</div><div style="display:flex;justify-content:space-around;font-size:12px"><span>R$ 0</span><span>◈ 0</span></div><input class="search" placeholder="Search" onkeydown="if(event.key==='Enter')search(this.value)">
<div class="sideitem active" onclick="show('Home')">⌂ &nbsp; Home</div><div class="sideitem" onclick="show('Profile')">♟ &nbsp; My Roblox</div><div class="sideitem" onclick="show('Games')">▶ &nbsp; Games</div><div class="sideitem" onclick="show('Catalog')">◆ &nbsp; Catalog</div><div class="sideitem" onclick="show('Community')">● &nbsp; Community</div><div class="sideitem" onclick="show('Develop')">⚒ &nbsp; Develop</div><div class="sideitem" onclick="show('Messages')">✉ &nbsp; Messages</div><div class="sideitem" onclick="show('Groups')">♣ &nbsp; Groups</div><div class="sideitem" onclick="show('Inventory')">▤ &nbsp; Inventory</div><div class="sideitem" onclick="show('Avatar')">♙ &nbsp; Avatar</div></aside>
<main class="content" id="content"></main></div></div>
<div id="gameMenu" class="game-screen"><div class="menu-panel" id="menuPanel"></div></div>
<script>
const asset=n=>'file:///android_res/drawable-nodpi/'+n+'.png';
const tiles=[['Games','games2x','Play games'],['Catalog','catalog2x','Browse avatar items'],['Inventory','inventory2x','Your items'],['Builders Club','builders_club2x','Membership'],['Profile','profile2x','Your profile'],['Messages','messages2x','Inbox'],['Groups','groups2x','Find and join groups'],['Leaderboards','leaderboards2x','Player rankings']];
const games=[['Murder Mystery 2 Legacy','Classic mystery game','Play'],['Natural Disaster Survival','Survive disasters','Play'],['Work at a Pizza Place','Work with friends','Play'],['Speed Run 4','Run through obstacle courses','Play']];
let current='Home';
function card(title,desc,action='Open'){return '<div class="card"><h3>'+title+'</h3><p>'+desc+'</p><button class="btn" onclick="detail(\''+title.replace(/'/g,"\\'")+'\')">'+action+'</button></div>'}
function tile(t){return '<div class="tile" onclick="show(\''+t[0]+'\')"><div class="art"><img src="'+asset(t[1])+'" onerror="this.style.display=\'none\'"></div><div class="label">'+t[0]+'</div><div class="sub">'+t[2]+'</div></div>'}
function show(p){current=p;let c=document.getElementById('content');document.querySelectorAll('.sideitem').forEach(x=>x.classList.toggle('active',x.textContent.trim().includes(p)));let html='';
if(p==='Home'){html='<div class="page-title">Home</div><div class="homegrid">'+tiles.slice(0,4).map(tile).join('')+'</div><div class="section-title">Community</div><div class="homegrid">'+tiles.slice(4).map(tile).join('')+'</div>'}
else if(p==='Games'){html='<div class="page-title">Games</div><div class="tabs"><button>Featured</button><button>Popular</button><button>Top Earning</button><button>Top Rated</button></div><h3>Top Rated</h3><div class="cards">'+games.map(g=>card(g[0],g[1],'View Details')).join('')+'</div>'}
else if(p==='Catalog'){html='<div class="page-title">Featured Items on ROBLOX</div><div class="detail"><div><div class="sideitem">Featured Items</div><div class="sideitem">Hats</div><div class="sideitem">Faces</div><div class="sideitem">Gear</div><div class="sideitem">Shirts</div><div class="sideitem">Pants</div><div class="sideitem">T-Shirts</div></div><div class="cards">'+['Classic Fedora','Green Banded Top Hat','Silverthorn Antlers','ROBLOX Visor','Red Baseball Cap','Classic Sword'].map(x=>card(x,'Catalog item · View details','View Item')).join('')+'</div></div>'}
else if(p==='Avatar'){html='<div class="page-title">Character Customizer</div><div class="tabs"><button>Avatar</button><button>Body</button><button>Clothing</button><button>Costumes</button></div><div class="detail"><div class="preview">Avatar Preview</div><div><h3>Currently Wearing</h3><div class="cards">'+['Hats','Hair','Face','Shirts','Pants','Gear'].map(x=>card(x,'Equipped items')).join('')+'</div></div></div>'}
else if(p==='Profile'){html='<div class="page-title">Your Profile</div><div class="detail"><div class="preview">1234</div><div><h2>1234</h2><p>Active Places</p><p>My Friends</p><p>Player Badges</p><p>Groups</p></div></div><div class="section-title">Statistics</div><p>Account statistics and player information</p><div class="section-title">Favorites</div>'}
else if(p==='Groups'){html='<div class="page-title">Groups</div><div class="tabs"><button>My Groups</button><button>Search Groups</button><button>Create Group</button></div><div class="cards">'+card('My Groups','Groups joined by 1234')+card('Find Groups','Browse and search for groups')+'</div>'}
else if(p==='Inventory'){html='<div class="page-title">Inventory</div><div class="tabs"><button>All</button><button>Hats</button><button>Gear</button><button>Faces</button><button>Shirts</button><button>Pants</button></div><div class="cards">'+['Hats','Gear','Faces','Shirts','Pants','T-Shirts'].map(x=>card(x,'Items owned by 1234')).join('')+'</div>'}
else if(p==='Messages'){html='<div class="page-title">Messages</div><div class="tabs"><button>Inbox</button><button>Sent</button><button>Archived</button></div><p>No messages to display.</p>'}
else if(p==='Develop'){html='<div class="page-title">Develop</div><div class="cards">'+card('My Creations','Your places and models')+card('Library','Browse public models and decals')+'</div>'}
else if(p==='Community'){html='<div class="page-title">Community</div><div class="homegrid">'+tiles.slice(4).map(tile).join('')+'</div>'}
else if(p==='Game Details'){html='<div class="page-title">Murder Mystery 2 Legacy</div><div class="detail"><div class="preview">Game Thumbnail</div><div><h2>Murder Mystery 2 Legacy</h2><p>Classic Roblox game details</p><p>Created by the original game creator</p><button class="btn" onclick="startGame()">Play</button></div></div><div class="section-title">Description</div><p>Game description and server information.</p>'}
else{html='<div class="page-title">'+p+'</div><p>Classic 2014 '+p+' page.</p>'}
c.innerHTML=html}
function detail(name){if(name==='Murder Mystery 2 Legacy'||name.includes('Natural')||name.includes('Pizza')||name.includes('Speed'))show('Game Details');else show('Catalog')}
function search(q){show('Games')}
function startGame(){document.getElementById('gameMenu').style.display='flex';pauseMenu()}
function pauseMenu(){document.getElementById('menuPanel').innerHTML='<h2>Game Menu</h2><button onclick="resumeGame()">Resume Game</button><button onclick="showSettings()">Settings</button><button onclick="confirmReset()">Reset Character</button><button onclick="showReport()">Report Abuse</button><button onclick="leaveGame()">Leave Game</button>'}
function resumeGame(){document.getElementById('gameMenu').style.display='none'}
function showSettings(){document.getElementById('menuPanel').innerHTML='<h2>Settings</h2><p>Camera Mode　Default</p><p>Movement Mode　Default</p><p>Volume　━━━━●</p><p>Graphics Mode　Automatic</p><button onclick="pauseMenu()">Back to Menu</button>'}
function confirmReset(){document.getElementById('menuPanel').innerHTML='<h2>Are you sure you want to reset your character?</h2><button onclick="pauseMenu()">Cancel</button><button onclick="pauseMenu()">Reset</button>'}
function showReport(){document.getElementById('menuPanel').innerHTML='<h2>Report Abuse</h2><p>Choose a reason</p><select><option>Inappropriate language</option><option>Scamming</option><option>Exploiting</option><option>Other rule violation</option></select><p><textarea placeholder="Description"></textarea></p><button onclick="pauseMenu()">Submit</button><button onclick="pauseMenu()">Cancel</button>'}
function leaveGame(){document.getElementById('gameMenu').style.display='none';show('Home')}
show('Home');
</script></body></html>
